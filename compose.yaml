services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frota_fantasma}
      POSTGRES_USER: ${POSTGRES_USER:-frota_fantasma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLAN_TAG: ${CLAN_TAG:-#RQJGC9GV}
      CLASH_ROYALE_API_TOKEN: ${CLASH_ROYALE_API_TOKEN:?Set CLASH_ROYALE_API_TOKEN in .env}
      CLASH_CONNECT_TIMEOUT: ${CLASH_CONNECT_TIMEOUT:-5s}
      CLASH_READ_TIMEOUT: ${CLASH_READ_TIMEOUT:-10s}
      CLASH_MAX_ATTEMPTS: ${CLASH_MAX_ATTEMPTS:-2}
      CLASH_RETRY_DELAY: ${CLASH_RETRY_DELAY:-500ms}
      CLASH_RATE_LIMIT_COOLDOWN: ${CLASH_RATE_LIMIT_COOLDOWN:-30s}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-frota_fantasma}
      DB_USERNAME: ${POSTGRES_USER:-frota_fantasma}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

volumes:
  postgres_data:
